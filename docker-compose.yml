# The whole application:  docker compose up --build
#   http://localhost:4000       the Invixta web shop (nginx, forwards /api to the backend)
#   http://localhost:8100/docs  the API's Swagger UI
# (Other ports than the SupportAI project, so both can run at the same time.)
# The language model runs in Ollama on your machine (not in a container), see README.
name: invixta
services:
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 with the pgvector extension available
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"  # only reachable from this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"  # includes pytest/ruff/mypy so tests can run in the container
    env_file: .env
    ports:
      - "8100:8000"
    # Ollama runs on the host machine (it can use the Mac's GPU there). This name points to the host,
    # also on Linux where Docker doesn't define it by itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
      - ./sample_documents:/app/sample_documents:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Fulfillment: stands in for the warehouse and carrier integration. Ships paid orders and marks them
  # delivered after a few minutes (SIMULATION_*_MINUTES in .env), and cancels orders that were never paid.
  simulator:
    build:
      context: ./backend
    env_file: .env
    command: ["python", "scripts/fulfillment_simulator.py"]
    depends_on:
      backend:
        condition: service_healthy  # the backend has run the migrations
    volumes:
      - ./scripts:/app/scripts:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
