# On every push and pull request:  lint → type checking → tests  (backend and frontend in parallel),
# then the browser end-to-end tests against the full Docker Compose stack.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportai
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: supportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportai"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://supportai:ci-password@localhost:5432/supportai
      TEST_DATABASE_URL: postgresql+psycopg://supportai:ci-password@localhost:5432/supportai_test
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789
      EMBEDDING_CACHE_DIR: /home/runner/.cache/supportai-models
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/supportai-models
          key: embedding-model-bge-small-en-v1.5
      - name: Lint (ruff)
        run: |
          ruff check . ../scripts --config pyproject.toml
          ruff format --check . ../scripts --config pyproject.toml
      - name: Type checking (mypy, strict)
        run: mypy app tests ../scripts
      - name: Tests (pytest, real PostgreSQL + pgvector)
        run: pytest

  frontend:
    name: Frontend (oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type checking (tsc)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npx vite build

  e2e:
    name: End-to-end (Playwright, full Docker stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          password=$(openssl rand -hex 16)
          sed -i "s/change-me-to-a-long-random-string/$(openssl rand -hex 32)/" .env
          sed -i "s/change-me/$password/g" .env
      - name: Start frontend, backend and PostgreSQL (scripted LLM, no API key needed)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Load demo data and index the sample documents
        run: |
          docker compose exec -T backend python scripts/seed_database.py --reset
          docker compose exec -T backend python scripts/ingest_documents.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Backend logs
        if: failure()
        run: docker compose logs backend --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
