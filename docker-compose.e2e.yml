# Override for the browser end-to-end tests (and CI): the backend uses the deterministic,
# rule-based LLM stand-in instead of Ollama, so tests are repeatable and CI needs no 5 GB model.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
services:
  backend:
    environment:
      LLM_PROVIDER: scripted
      # The rules of the scripted model decide the tools themselves; no rewrite/automatic search turn.
      AGENT_SEARCH_FIRST: "false"
      RAG_QUERY_REWRITE: "false"
      CHAT_MESSAGES_PER_MINUTE: "200"
